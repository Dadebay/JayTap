apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'finaldev.motion_sensors'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
